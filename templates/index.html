    body{background:var(--sand);color:var(--bark);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--terracotta-dark)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1d5f76!important;outline-offset:3px;box-shadow:none!important}.navbar{background:rgba(243,238,228,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand-mark{width:48px;height:48px}.brand-name{font-weight:800;letter-spacing:-.04em;line-height:1.05}.nav-link{color:var(--bark)}.btn-earth{background:var(--terracotta-dark);color:#fff;border-color:var(--terracotta-dark)}.btn-earth:hover{background:#693823;color:#fff}.btn-outline-earth{border-color:var(--terracotta-dark);color:var(--terracotta-dark)}.btn-outline-earth:hover{background:var(--terracotta-dark);color:#fff}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#ede3d2 0%,#f7f1e7 56%,#e7e8d9 100%)}.hero:after{content:"";position:absolute;right:-7rem;top:-8rem;width:33rem;height:33rem;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(187,104,76,.22),rgba(112,122,83,.08) 60%,transparent 70%);pointer-events:none}.hero-inner{position:relative;z-index:1}.eyebrow{color:var(--olive-dark);text-transform:uppercase;letter-spacing:.13em;font-size:.77rem;font-weight:800}.display-title{font-size:clamp(2.75rem,7vw,5.8rem);line-height:.98;letter-spacing:-.065em;font-weight:850;max-width:11ch}.hero-art{min-height:320px;background:linear-gradient(145deg,rgba(98,68,50,.96),rgba(55,43,33,.98));border-radius:2rem;box-shadow:0 24px 55px rgba(48,38,31,.2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;width:24rem;height:24rem}.hero-art:after{width:31rem;height:31rem}.hero-hippo{width:min(84%,420px);position:relative;z-index:1;filter:drop-shadow(0 18px 10px rgba(0,0,0,.18))}.section-pad{padding:5rem 0}.surface{background:var(--glass);border:1px solid rgba(255,255,255,.72);box-shadow:0 12px 32px rgba(48,38,31,.07);backdrop-filter:blur(12px);border-radius:1.5rem}.service-icon{height:52px;width:52px;border-radius:16px;background:#ebe8d9;color:var(--olive-dark);display:grid;place-items:center;font-size:1.35rem}.service-card{height:100%;transition:transform .18s ease,box-shadow .18s ease}.service-card:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(48,38,31,.11)}.form-control,.form-select{border-color:#cfc4b5;background-color:#fffdf9;min-height:48px}.form-control:focus,.form-select:focus{border-color:var(--olive);box-shadow:0 0 0 .2rem rgba(112,122,83,.18)}.dashboard-shell{min-height:70vh}.stepper{display:flex;align-items:flex-start;gap:0;list-style:none;padding:0;margin:1.5rem 0}.step{flex:1;position:relative;text-align:center;color:#6f675e;font-size:.74rem;font-weight:650}.step:not(:last-child):before{content:"";height:3px;background:#d9d0c3;position:absolute;top:13px;left:50%;right:-50%;z-index:0}.step-dot{width:28px;height:28px;margin:0 auto .5rem;display:grid;place-items:center;border-radius:50%;background:#e2dbcf;border:2px solid #d0c6b8;position:relative;z-index:1}.step.is-done .step-dot{background:var(--olive);color:#fff;border-color:var(--olive)}.step.is-done:not(:last-child):before{background:var(--olive)}.step.is-current .step-dot{background:var(--terracotta-dark);color:#fff;border-color:var(--terracotta-dark);box-shadow:0 0 0 4px rgba(187,104,76,.17)}.job-card{border:1px solid var(--line);border-radius:1.25rem;background:#fffdf9}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:.32rem .7rem;background:#e8eadf;color:var(--olive-dark);font-size:.77rem;font-weight:700}.footer{background:#30261f;color:#f6f0e6}.footer a{color:#f6c2a6}.role-select{max-width:190px}.status-live{color:var(--olive-dark);font-weight:700}.form-note{min-height:1.5rem}.section-title{letter-spacing:-.04em;font-weight:800}.skip-link{position:absolute;top:-100px;left:1rem;z-index:2000;background:#fff;padding:.75rem}.skip-link:focus{top:1rem}@media(max-width:767px){.section-pad{padding:3.5rem 0}.hero-art{min-height:260px}.step{font-size:.62rem}.step-dot{width:24px;height:24px}.role-select{max-width:100%}}

  <div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"><div id="notice-toast" class="toast" role="status"><div class="toast-body d-flex align-items-center gap-2"><i class="bi bi-check-circle-fill text-success" aria-hidden="true"></i><span id="notice-text"></span><button type="button" class="btn-close ms-auto" data-bs-dismiss="toast" aria-label="Close"></button></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    const strApi = '/api';
    const arrStages = ['Pending', 'In Production', 'Quality Check', 'Shipped', 'Completed'];
    const objApp = { role: 'landing' };
    const elAppView = document.getElementById('app-view');
    const elRoleToggle = document.getElementById('role-toggle');
    const strDemoAdminNotice = 'Role preview only: this demo uses a client supplied role header. Add real identity and authorization before deployment.';
    document.getElementById('year').textContent = new Date().getFullYear();

    function escapeHtml(strValue) {
      return String(strValue ?? '').replace(/[&<>"']/g, (strMatch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[strMatch]));
    }
    function formatDate(strValue) {
      if (!strValue) return 'To be confirmed';
      const objDate = new Date(`${strValue}T00:00:00`);
      return Number.isNaN(objDate.getTime()) ? 'To be confirmed' : new Intl.DateTimeFormat(undefined, {dateStyle:'medium'}).format(objDate);
    }
    function hippoSvg() {
      return `<svg class="hero-hippo" viewBox="0 0 460 300" role="img" aria-labelledby="heroHippoTitle"><title id="heroHippoTitle">A front-facing cartoon hippo with the familiar rounded face above a much larger swollen body and short feet</title><ellipse cx="230" cy="270" rx="178" ry="12" fill="#222a2d" opacity=".34"/><path d="M111 218v27q0 14 14 14h35q14 0 14-14v-31m122 0v31q0 14 14 14h35q14 0 14-14v-27" fill="#788787" stroke="#344047" stroke-width="6" stroke-linejoin="round"/><path d="M62 188q-2-58 25-82 23-21 57-16 37 7 86 34 49-27 86-34 34-5 57 16 27 24 25 82-1 47-31 65-38 23-137 23t-137-23q-30-18-31-65z" fill="#95a5a3" stroke="#344047" stroke-width="7" stroke-linejoin="round"/><path d="M85 216q52 30 145 30t145-30" fill="none" stroke="#788787" stroke-width="5" stroke-linecap="round"/><path d="M158 78q-7-22-17-20-10 3-5 17l9 18m147-15q7-22 17-20 10 3 5 17l-9 18" fill="#95a5a3" stroke="#344047" stroke-width="5" stroke-linecap="round"/><path d="M145 113q0-53 39-68 20-8 46-8t46 8q39 15 39 68v27q0 46-39 61-20 8-46 8t-46-8q-39-15-39-61z" fill="#95a5a3" stroke="#344047" stroke-width="6" stroke-linejoin="round"/><ellipse cx="184" cy="113" rx="14" ry="17" fill="#788787" stroke="#344047" stroke-width="3"/><ellipse cx="276" cy="113" rx="14" ry="17" fill="#788787" stroke="#344047" stroke-width="3"/><ellipse cx="186" cy="112" rx="9" ry="12" fill="#fff4df"/><ellipse cx="278" cy="112" rx="9" ry="12" fill="#fff4df"/><circle cx="189" cy="115" r="5" fill="#29343a"/><circle cx="281" cy="115" r="5" fill="#29343a"/><circle cx="190" cy="112" r="2" fill="#fff"/><circle cx="282" cy="112" r="2" fill="#fff"/><path d="M167 89q15-11 30-4m66 0q15-7 30 4" fill="none" stroke="#344047" stroke-width="5" stroke-linecap="round"/><ellipse cx="230" cy="153" rx="88" ry="43" fill="#c6c8b6" stroke="#344047" stroke-width="5"/><ellipse cx="201" cy="147" rx="8" ry="6" fill="#465358"/><ellipse cx="259" cy="147" rx="8" ry="6" fill="#465358"/><path d="M203 173q27 15 54 0" fill="none" stroke="#344047" stroke-width="4" stroke-linecap="round"/><path d="M174 167q-1 11 5 15 6 2 9-5l1-11m76 0 1 11q3 7 9 5 6-4 5-15" fill="#fff1d9" stroke="#344047" stroke-width="3" stroke-linejoin="round"/><ellipse cx="113" cy="178" rx="12" ry="7" fill="#e9aaa3" opacity=".7"/><ellipse cx="347" cy="178" rx="12" ry="7" fill="#e9aaa3" opacity=".7"/><path d="M118 250q18 8 39 1m147 0q20 7 39-1" fill="none" stroke="#344047" stroke-width="4" stroke-linecap="round"/></svg>`;
    }
    function landingView() {
      return `<section class="hero py-5 py-lg-6"><div class="container hero-inner py-lg-5"><div class="row align-items-center g-5"><div class="col-lg-6"><p class="eyebrow mb-3">Your shop-floor prototyping partner</p><h1 class="display-title mb-4">Make the next thing real.</h1><p class="lead text-secondary mb-4" style="max-width:36rem">Rapid prototyping support for domestic manufacturers. From a rough sketch to a tested part, we help your team move with confidence.</p><div class="d-flex flex-wrap gap-3"><a class="btn btn-earth btn-lg rounded-pill px-4" href="#inquiry">Tell us what you’re building <i class="bi bi-arrow-up-right ms-1" aria-hidden="true"></i></a><a class="btn btn-outline-earth btn-lg rounded-pill px-4" href="#services">Explore capabilities</a></div><div class="mt-4 small text-secondary"><i class="bi bi-geo-alt me-1" aria-hidden="true"></i>Designed and built with domestic manufacturing in mind</div></div><div class="col-lg-6"><div class="hero-art">${hippoSvg()}<span class="position-absolute bottom-0 start-0 m-3 badge rounded-pill text-bg-light px-3 py-2">Curious by design. Solid by nature.</span></div></div></div></div></section>
      <section class="section-pad" id="services"><div class="container"><div class="row align-items-end mb-4"><div class="col-lg-8"><p class="eyebrow">One capable team</p><h2 class="section-title display-5">From first concept to shop floor.</h2></div><div class="col-lg-4 text-secondary">We bring practical engineering and thoughtful design together to shorten the distance between an idea and a working prototype.</div></div><div class="row g-3"><div class="col-md-6 col-xl-3"><article class="surface service-card p-4"><div class="service-icon mb-3"><i class="bi bi-box-seam" aria-hidden="true"></i></div><h3 class="h5 fw-bold">Additive &amp; Subtractive</h3><p class="text-secondary mb-0">Functional prototypes, fixtures, and production-ready parts made with the right process for the job.</p></article></div><div class="col-md-6 col-xl-3"><article class="surface service-card p-4"><div class="service-icon mb-3"><i class="bi bi-cpu" aria-hidden="true"></i></div><h3 class="h5 fw-bold">Electronics Design</h3><p class="text-secondary mb-0">Embedded systems and electronics development that connect physical products to real-world performance.</p></article></div><div class="col-md-6 col-xl-3"><article class="surface service-card p-4"><div class="service-icon mb-3"><i class="bi bi-code-slash" aria-hidden="true"></i></div><h3 class="h5 fw-bold">Software Development</h3><p class="text-secondary mb-0">Purpose-built software, firmware, and interfaces that make your product work as one system.</p></article></div><div class="col-md-6 col-xl-3"><article class="surface service-card p-4"><div class="service-icon mb-3"><i class="bi bi-rulers" aria-hidden="true"></i></div><h3 class="h5 fw-bold">Digital &amp; Industrial Design</h3><p class="text-secondary mb-0">Clear, manufacturable design decisions from early exploration through detailed engineering.</p></article></div></div></div></section>
      <section class="pb-5 pb-lg-6" id="inquiry"><div class="container"><div class="row g-4 align-items-stretch"><div class="col-lg-5"><div class="h-100 rounded-4 p-4 p-lg-5" style="background:#e5e5d5"><p class="eyebrow">Let’s get to work</p><h2 class="section-title display-6">Every good build starts with a conversation.</h2><p class="text-secondary">Share what you have in mind. We’ll review your goals and follow up with a practical next step.</p><div class="mt-4 d-flex gap-3"><div class="service-icon flex-shrink-0"><i class="bi bi-chat-square-text" aria-hidden="true"></i></div><p class="mb-0 small text-secondary">A real person reviews every inquiry. No pressure, just useful engineering conversation.</p></div></div></div><div class="col-lg-7"><div class="surface p-4 p-lg-5"><h3 class="h4 fw-bold mb-1">Start a project inquiry</h3><p class="text-secondary mb-4">Fields marked <span aria-label="required">*</span> are required.</p><form id="inquiry-form" novalidate><div class="row g-3"><div class="col-md-6"><label for="customer_name" class="form-label fw-semibold">Your name <span aria-hidden="true">*</span></label><input class="form-control" id="customer_name" name="customer_name" autocomplete="name" required minlength="2" maxlength="120"><div class="invalid-feedback">Enter your name (at least 2 characters).</div></div><div class="col-md-6"><label for="email" class="form-label fw-semibold">Work email <span aria-hidden="true">*</span></label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required maxlength="254"><div class="invalid-feedback">Enter a valid email address.</div></div><div class="col-md-6"><label for="company" class="form-label fw-semibold">Company <span aria-hidden="true">*</span></label><input class="form-control" id="company" name="company" autocomplete="organization" required minlength="2" maxlength="120"><div class="invalid-feedback">Enter your company name.</div></div><div class="col-md-6"><label for="service" class="form-label fw-semibold">What do you need? <span aria-hidden="true">*</span></label><select class="form-select" id="service" name="service" required><option value="">Choose a capability</option><option>Additive &amp; Subtractive Manufacturing</option><option>Electronics Design &amp; Development</option><option>Software Development</option><option>Digital &amp; Industrial Design</option><option>Not sure yet</option></select><div class="invalid-feedback">Choose a capability.</div></div><div class="col-12"><label for="project_details" class="form-label fw-semibold">Tell us about your project <span aria-hidden="true">*</span></label><textarea class="form-control" id="project_details" name="project_details" rows="4" required minlength="10" maxlength="4000" placeholder="What are you making, and what would a successful next step look like?"></textarea><div class="invalid-feedback">Add at least 10 characters about your project.</div></div><div class="col-md-6"><label for="budget" class="form-label fw-semibold">Estimated budget <span class="text-secondary fw-normal">(optional)</span></label><select class="form-select" id="budget" name="budget"><option value="">Select a range</option><option>Under $2,500</option><option>$2,500–$10,000</option><option>$10,000–$25,000</option><option>$25,000+</option><option>Need guidance</option></select></div><div class="col-12"><p class="small text-secondary mb-2">We’ll use your details to respond to this inquiry.</p><button class="btn btn-earth rounded-pill px-4" type="submit">Send inquiry <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></button><div class="form-note mt-2 small" id="form-message" aria-live="polite"></div></div></div></form></div></div></div></div></section>`;
    }
    function makeStepper(strStatus) {
      const intCurrent = arrStages.indexOf(strStatus);
      return `<ol class="stepper" aria-label="Job progress">${arrStages.map((strStage, intIndex) => {const strState = intIndex < intCurrent ? 'is-done' : intIndex === intCurrent ? 'is-current' : '';const strAria = intIndex === intCurrent ? ' aria-current="step"' : '';return `<li class="step ${strState}"${strAria}><span class="step-dot">${intIndex < intCurrent ? '<i class="bi bi-check" aria-hidden="true"></i>' : intIndex + 1}</span><span>${escapeHtml(strStage)}</span></li>`;}).join('')}</ol>`;
    }
    function customerJobCard(objJob) {
      return `<article class="job-card p-3 p-md-4 mb-3"><div class="d-flex flex-wrap justify-content-between gap-2 align-items-start"><div><span class="small text-secondary">JOB ${escapeHtml(objJob.id.slice(0,8).toUpperCase())}</span><h3 class="h5 fw-bold mb-1">${escapeHtml(objJob.service)}</h3><p class="text-secondary mb-0">${escapeHtml(objJob.company)}</p></div><span class="tag">${escapeHtml(objJob.status)}</span></div>${makeStepper(objJob.status)}<div class="row g-3 border-top pt-3"><div class="col-sm-6"><span class="small text-secondary d-block">Estimated completion</span><strong>${formatDate(objJob.estimated_completion_date)}</strong></div><div class="col-sm-6"><span class="small text-secondary d-block">Estimated shipping</span><strong>${formatDate(objJob.estimated_shipping_date)}</strong></div></div></article>`;
    }
    async function fetchJobs(strRole) {
      const objResponse = await fetch(`${strApi}/jobs?role=${encodeURIComponent(strRole)}`, {headers:{'X-User-Role':strRole}});
      if (!objResponse.ok) throw new Error(`Could not load jobs (${objResponse.status}).`);
      return objResponse.json();
    }
    async function customerView() {
      elAppView.innerHTML = `<section class="dashboard-shell section-pad"><div class="container"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><p class="eyebrow mb-2">Customer workspace</p><h1 class="section-title display-6 mb-1">Your project progress</h1><p class="text-secondary mb-0">A clear view of what’s moving through the shop.</p></div><span class="status-live"><i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i>Live project status</span></div><div id="customer-jobs" aria-live="polite"><div class="surface p-4">Loading your projects…</div></div><p class="small text-secondary mt-3">Demo view: displays all active prototype jobs. Sign-in and customer-specific access require a production identity system.</p></div></section>`;
      try {const objData = await fetchJobs('customer');const elTarget = document.getElementById('customer-jobs');elTarget.innerHTML = objData.jobs.length ? objData.jobs.map(customerJobCard).join('') : `<div class="surface p-5 text-center"><div class="service-icon mx-auto mb-3"><i class="bi bi-inboxes" aria-hidden="true"></i></div><h2 class="h4 fw-bold">No active projects yet</h2><p class="text-secondary">When you share a project idea, its progress will show up here.</p><button class="btn btn-earth rounded-pill" type="button" data-role="landing">Start an inquiry</button></div>`;} catch(objError) {document.getElementById('customer-jobs').innerHTML = `<div class="alert alert-danger" role="alert">${escapeHtml(objError.message)}</div>`;}
    }
    function adminJobCard(objJob) {
      return `<article class="job-card p-3 p-lg-4 mb-3" data-job-id="${escapeHtml(objJob.id)}"><div class="row g-3 align-items-end"><div class="col-lg-4"><span class="small text-secondary">JOB ${escapeHtml(objJob.id.slice(0,8).toUpperCase())}</span><h3 class="h5 fw-bold mb-1">${escapeHtml(objJob.service)}</h3><p class="mb-1">${escapeHtml(objJob.customer_name)} · ${escapeHtml(objJob.company)}</p><a href="mailto:${escapeHtml(objJob.email)}">${escapeHtml(objJob.email)}</a><p class="small text-secondary mt-2 mb-0">${escapeHtml(objJob.project_details)}</p></div><div class="col-sm-4 col-lg-2"><label class="form-label small fw-semibold" for="status-${escapeHtml(objJob.id)}">Stage</label><select class="form-select form-select-sm job-status" id="status-${escapeHtml(objJob.id)}">${arrStages.map(strStage => `<option${strStage === objJob.status ? ' selected' : ''}>${strStage}</option>`).join('')}</select></div><div class="col-sm-4 col-lg-2"><label class="form-label small fw-semibold" for="completion-${escapeHtml(objJob.id)}">Est. completion</label><input class="form-control form-control-sm job-completion" id="completion-${escapeHtml(objJob.id)}" type="date" value="${escapeHtml(objJob.estimated_completion_date || '')}"></div><div class="col-sm-4 col-lg-2"><label class="form-label small fw-semibold" for="shipping-${escapeHtml(objJob.id)}">Est. shipping</label><input class="form-control form-control-sm job-shipping" id="shipping-${escapeHtml(objJob.id)}" type="date" value="${escapeHtml(objJob.estimated_shipping_date || '')}"></div><div class="col-lg-2"><button class="btn btn-earth btn-sm rounded-pill w-100 save-job" type="button"><i class="bi bi-save me-1" aria-hidden="true"></i>Save update</button><div class="small text-success mt-1 save-result" aria-live="polite"></div></div></div></article>`;
    }
    async function adminView() {
      elAppView.innerHTML = `<section class="dashboard-shell section-pad"><div class="container"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><p class="eyebrow mb-2">Production desk</p><h1 class="section-title display-6 mb-1">Inquiry &amp; job board</h1><p class="text-secondary mb-0">Review project requests and keep delivery plans current.</p></div><span class="badge rounded-pill text-bg-warning">${escapeHtml(strDemoAdminNotice)}</span></div><div id="admin-jobs" aria-live="polite"><div class="surface p-4">Loading inquiries…</div></div></div></section>`;
      try {const objData = await fetchJobs('admin');const elTarget = document.getElementById('admin-jobs');if (!objData.jobs.length) {elTarget.innerHTML = `<div class="surface p-5 text-center"><h2 class="h4">No inquiries yet</h2><p class="text-secondary mb-0">Submitted project inquiries will appear here.</p></div>`;return;}elTarget.innerHTML = `<p class="small text-secondary">${objData.jobs.length} project${objData.jobs.length === 1 ? '' : 's'} · updates save directly to the API</p>${objData.jobs.map(adminJobCard).join('')}`;} catch(objError) {document.getElementById('admin-jobs').innerHTML = `<div class="alert alert-danger" role="alert">${escapeHtml(objError.message)}</div>`;}
    }
    function showView(strRole) {
      objApp.role = strRole;
      if (strRole === 'customer') customerView();
      else if (strRole === 'admin') adminView();
      else elAppView.innerHTML = landingView();
      window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    }
    elRoleToggle.addEventListener('change', () => showView(elRoleToggle.value));
    document.getElementById('brand-home').addEventListener('click', (objEvent) => {objEvent.preventDefault();elRoleToggle.value='landing';showView('landing');});
    document.addEventListener('click', (objEvent) => {const elRoleButton = objEvent.target.closest('[data-role]');if(elRoleButton){elRoleToggle.value=elRoleButton.dataset.role;showView(elRoleButton.dataset.role);}});
    document.addEventListener('submit', async (objEvent) => {
      if (objEvent.target.id !== 'inquiry-form') return;
      objEvent.preventDefault();
      const elForm = objEvent.target;
      elForm.classList.add('was-validated');
      if (!elForm.checkValidity()) {elForm.querySelector(':invalid').focus();return;}
      const elMessage = document.getElementById('form-message');
      const elSubmit = elForm.querySelector('[type="submit"]');
      elSubmit.disabled = true;elMessage.className='form-note mt-2 small text-secondary';elMessage.textContent='Sending your inquiry…';
      const objPayload = Object.fromEntries(new FormData(elForm).entries());
      try {const objResponse = await fetch(`${strApi}/inquiry`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(objPayload)});const objData=await objResponse.json();if(!objResponse.ok) throw new Error(objData.detail?.[0]?.msg || objData.detail || 'We could not send your inquiry. Please try again.');elMessage.className='form-note mt-2 small text-success';elMessage.textContent=objData.message;elForm.reset();elForm.classList.remove('was-validated');}
      catch(objError){elMessage.className='form-note mt-2 small text-danger';elMessage.textContent=objError.message;}
      finally{elSubmit.disabled=false;}
    });
    document.addEventListener('click', async (objEvent) => {
      const elSave = objEvent.target.closest('.save-job');if(!elSave)return;
      const elCard = elSave.closest('[data-job-id]');const strJobId = elCard.dataset.jobId;const elResult=elCard.querySelector('.save-result');
      const objPayload={status:elCard.querySelector('.job-status').value,estimated_completion_date:elCard.querySelector('.job-completion').value||null,estimated_shipping_date:elCard.querySelector('.job-shipping').value||null};
      elSave.disabled=true;elResult.textContent='Saving…';
      try{const objResponse=await fetch(`${strApi}/jobs/${encodeURIComponent(strJobId)}`,{method:'PUT',headers:{'Content-Type':'application/json','X-User-Role':'admin'},body:JSON.stringify(objPayload)});const objData=await objResponse.json();if(!objResponse.ok)throw new Error(objData.detail||'Update failed');elResult.textContent='Saved';elResult.className='small text-success mt-1 save-result';}
      catch(objError){elResult.textContent=objError.message;elResult.className='small text-danger mt-1 save-result';}
      finally{elSave.disabled=false;}
    });
    showView('landing');
  </script>
</body>
</html>
