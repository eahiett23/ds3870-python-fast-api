# Install as /etc/systemd/system/swollenhippo.service.d/20-mysql.conf
# only AFTER the final import has been verified. Retains the existing unit's
# www-data identity, working directory, environment file and hardening.
[Service]
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/opt/swollenhippo/.venv/bin/uvicorn mysql_portal:app --host 127.0.0.1 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=127.0.0.1
